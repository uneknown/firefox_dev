<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS UI: a vertical multiline inline has one connected outline</title>
<link rel="help" href="https://drafts.csswg.org/css-ui/#outline-props">
<link rel="match" href="reference/outline-multiline-inline-vertical-001-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
  div {
    width: 100px;
    height: 200px;
    color: transparent;
    font: 50px/1 Ahem;
    writing-mode: vertical-rl;
  }

  span {
    outline: 4px solid blue;
    outline-offset: 3px;
  }
</style>
<div><span>XXXX XXXX</span></div>
