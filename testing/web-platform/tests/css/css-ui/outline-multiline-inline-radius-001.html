<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS UI: a multiline inline has one rounded outline</title>
<link rel="help" href="https://drafts.csswg.org/css-ui/#outline-props">
<link rel="match" href="reference/outline-multiline-inline-radius-001-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
  div {
    width: 200px;
    color: transparent;
    font: 50px/1 Ahem;
  }

  span {
    border-radius: 20px;
    outline: 6px dashed blue;
    outline-offset: 4px;
  }
</style>
<div><span>XXXX XXXX</span></div>
