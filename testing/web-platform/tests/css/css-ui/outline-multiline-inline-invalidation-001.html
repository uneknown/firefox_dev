<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>CSS UI: multiline inline outline invalidation</title>
<link rel="help" href="https://drafts.csswg.org/css-ui/#outline-props">
<link rel="match" href="reference/outline-multiline-inline-001-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
  div {
    width: 450px;
    color: transparent;
    font: 50px/1 Ahem;
  }

  span {
    outline: 4px solid blue;
    outline-offset: 3px;
  }
</style>
<div><span>XXXX XXXX</span></div>
<script>
  document.documentElement.addEventListener("TestRendered", () => {
    document.querySelector("div").style.width = "200px";
    document.documentElement.classList.remove("reftest-wait");
  });
</script>
</html>
